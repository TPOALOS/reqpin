[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reqpin"
version = "1.1.0"
description = "Offline security auditor for pip requirements files: unpinned versions, missing hashes, risky indexes, typosquats. Follows -r includes, JSON and SARIF output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["pip", "requirements", "supply-chain-security", "typosquatting", "sarif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/reqpin"

[project.scripts]
reqpin = "reqpin:main"

[tool.setuptools]
py-modules = ["reqpin"]
